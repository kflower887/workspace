<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>망고월드 - 군포 당정동 이야기</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- 상단 플로팅 컨트롤 (전체 폭 메뉴바 없이 좌/우에 따로 떠 있음) -->
  <header id="topbar">
    <div id="topbar-left">
      <button id="btn-home" class="icon-btn" title="지도로">🗺️</button>
      <div id="topbar-avatar"></div>
    </div>
    <div id="coin-display" title="망고월렛">
      🥭 <span class="wallet-label">망고월렛</span> <span id="coin-count">0</span>
    </div>
  </header>

  <!-- 마을 지도 화면 -->
  <main id="screen-map" class="screen">
    <div class="map-intro">
      <h1>망고월드 <span class="sub">군포 당정동 이야기</span></h1>
      <p class="lead" id="map-lead">나만의 캐릭터를 만들고 군포 곳곳을 자유롭게 탐험해보세요!</p>
    </div>
    <div id="town-grid"></div>
  </main>

  <!-- 장소 화면 (동적으로 채워짐) -->
  <main id="screen-location" class="screen hidden">
    <section class="room-wrap">
      <div id="room-canvas"></div>
      <button id="ui-toggle" class="ui-toggle-btn" title="화면 전체보기">⛶</button>
    </section>

    <div id="location-sidebar">
      <section class="location-header">
        <h2 id="loc-title"></h2>
        <p id="loc-desc"></p>
      </section>

      <section id="loc-activity" class="panel hidden"></section>

      <nav id="room-tabs">
        <button class="tab-btn active" data-tab="inventory">🎒 보관함</button>
        <button class="tab-btn" data-tab="shop">🛍️ 상점</button>
      </nav>

      <section id="tab-inventory" class="tab-panel"></section>
      <section id="tab-shop" class="tab-panel hidden"></section>
    </div>
  </main>

  <div id="fx-layer"></div>

  <div id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/avatar.js"></script>
<script src="js/game.js"></script>
</body>
</html>
